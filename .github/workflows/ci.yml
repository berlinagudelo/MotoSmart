name: CI

on:
  push:
  pull_request:

jobs:
  sqlite:
    name: Pruebas en SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ejecutar migraciones sobre SQLite
        env:
          MOTOSMART_DATABASE_URL: sqlite:///./ci_sqlite.db
          MOTOSMART_JWT_SECRET_KEY: ci-only-key-with-at-least-32-characters
        run: python -m alembic upgrade head
      - name: Pruebas unitarias
        env:
          MOTOSMART_DATABASE_URL: sqlite://
          MOTOSMART_JWT_SECRET_KEY: ci-only-key-with-at-least-32-characters
        run: python -m unittest discover -s tests -v

  postgresql:
    name: Pruebas y migraciones en PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: motorsmart_test
          POSTGRES_USER: motorsmart
          POSTGRES_PASSWORD: motorsmart_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motorsmart -d motorsmart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MOTOSMART_DATABASE_URL: postgresql+psycopg2://motorsmart:motorsmart_ci_password@127.0.0.1:5432/motorsmart_test
      MOTOSMART_JWT_SECRET_KEY: ci-only-key-with-at-least-32-characters
      MOTOSMART_ENV: development
      MOTOSMART_RATELIMIT: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Aplicar migraciones
        run: python -m alembic upgrade head
      - name: Verificar que no hay cambios de esquema sin migración
        run: python -m alembic check
      - name: Pruebas unitarias contra PostgreSQL
        run: python -m unittest discover -s tests -v
