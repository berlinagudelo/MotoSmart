<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Verificar correo | MotoSmart</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <main class="auth-layout">
    <section class="auth-panel">
      <div class="auth-card">
        <div class="form-heading">
          <h1>Verifica tu correo</h1>
          <p>Elige una contraseña para terminar de crear tu cuenta.</p>
        </div>
        <form id="verify-registration-form" class="auth-form">
          <label>Contraseña
            <input name="password" type="password" minlength="6" autocomplete="new-password" required>
          </label>
          <label>Confirma tu contraseña
            <input name="password_confirm" type="password" minlength="6" autocomplete="new-password" required>
          </label>
          <button class="btn primary wide">Verificar y crear cuenta</button>
        </form>
        <p id="verification-status" role="status" aria-live="polite"></p>
        <a href="/">Volver a MotoSmart</a>
      </div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/verify-registration.js') }}" defer></script>
</body>
</html>
