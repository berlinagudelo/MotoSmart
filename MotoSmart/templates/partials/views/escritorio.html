<section id="view-escritorio" class="view active">
  <div class="desktop-welcome">
    <div>
      <p class="eyebrow">Tu espacio MotoSmart</p>
      <h2>Hola, <span id="desktop-greeting">bienvenido</span></h2>
      <p>Abre una app para continuar con la gestión de tu moto o taller.</p>
    </div>
  </div>
  <h3 class="desktop-section-heading">Aplicaciones</h3>
  <section class="desktop-apps" aria-label="Aplicaciones disponibles">
    <button class="desktop-app" data-app-roles="cliente admin titular" data-go="inicio">
      <svg class="desktop-app-icon" aria-hidden="true"><use href="#icon-home"></use></svg>
      <strong>Resumen</strong><span>Estado general</span>
    </button>
    <button class="desktop-app" data-app-roles="cliente" data-go="resultados">
      <svg class="desktop-app-icon" aria-hidden="true"><use href="#icon-results"></use></svg>
      <strong>Resultados</strong><span>Historial de servicio</span>
    </button>
    <button class="desktop-app" data-app-roles="cliente mecanico admin titular" data-go="motos">
      <svg class="desktop-app-icon" aria-hidden="true"><use href="#icon-moto"></use></svg>
      <strong><span data-client>Mis motos</span><span data-admin class="hidden">Motos</span></strong>
      <span>Vehículos registrados</span>
    </button>
    <button class="desktop-app" data-app-roles="cliente" data-go="citas">
      <svg class="desktop-app-icon" aria-hidden="true"><use href="#icon-calendar"></use></svg>
      <strong>Mis citas</strong><span>Agenda de servicio</span>
    </button>
    <button class="desktop-app" data-app-roles="mecanico titular" data-go="citas">
      <svg class="desktop-app-icon" aria-hidden="true"><use href="#icon-calendar"></use></svg>
      <strong>Citas</strong><span>Agenda del taller</span>
    </button>
    <button class="desktop-app" data-app-roles="mecanico titular" data-go="scanner">
      <svg class="desktop-app-icon" aria-hidden="true"><use href="#icon-scan"></use></svg>
      <strong>Escáner OCR</strong><span>Leer códigos de falla</span>
    </button>
    <button class="desktop-app" data-app-roles="mecanico titular" data-go="revision-mecanica">
      <svg class="desktop-app-icon" aria-hidden="true"><use href="#icon-tools"></use></svg>
      <strong>Revisión mecánica</strong><span>Registrar una revisión</span>
    </button>
    <button class="desktop-app" data-app-roles="mecanico titular" data-go="prioridades">
      <svg class="desktop-app-icon" aria-hidden="true"><use href="#icon-alert"></use></svg>
      <strong>Prioridades</strong><span>Servicios por atender</span>
    </button>
    <button class="desktop-app" data-app-roles="mecanico titular" data-go="facturacion">
      <svg class="desktop-app-icon" aria-hidden="true"><use href="#icon-card"></use></svg>
      <strong>Facturación</strong><span>Gestionar cobros</span>
    </button>
    <button class="desktop-app" data-app-roles="mecanico titular" data-go="ordenes">
      <svg class="desktop-app-icon" aria-hidden="true"><use href="#icon-clipboard"></use></svg>
      <strong>Órdenes de servicio</strong><span>Trabajos del taller</span>
    </button>
    <button class="desktop-app" data-app-roles="mecanico admin titular" data-go="diagnosticos">
      <svg class="desktop-app-icon" aria-hidden="true"><use href="#icon-diagnostics"></use></svg>
      <strong>Diagnósticos</strong><span>Historial de lecturas</span>
    </button>
    <button class="desktop-app" data-app-roles="mecanico admin titular" data-go="inventario">
      <svg class="desktop-app-icon" aria-hidden="true"><use href="#icon-inventory"></use></svg>
      <strong>Inventario</strong><span>Repuestos y existencias</span>
    </button>
    <button class="desktop-app" data-app-roles="cliente" data-go="facturas">
      <svg class="desktop-app-icon" aria-hidden="true"><use href="#icon-receipt"></use></svg>
      <strong>Mis facturas</strong><span>Comprobantes de servicio</span>
    </button>
    <button class="desktop-app" data-app-roles="titular" data-go="mecanicos">
      <svg class="desktop-app-icon" aria-hidden="true"><use href="#icon-team"></use></svg>
      <strong>Mi equipo</strong><span>Gestionar mecánicos</span>
    </button>
    <button class="desktop-app" data-app-roles="cliente mecanico admin titular" data-go="cuenta">
      <svg class="desktop-app-icon" aria-hidden="true"><use href="#icon-tools"></use></svg>
      <strong>Ajustes de cuenta</strong><span>Tu perfil</span>
    </button>
  </section>
</section>
