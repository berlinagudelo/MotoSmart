<dialog id="moto-modal"><form id="moto-form"><div class="modal-title"><div><p class="eyebrow">Nueva moto</p><h2>Registra una moto</h2></div><button class="close" type="button">×</button></div><div class="form-grid"><label>Placa<input name="placa" placeholder="ABC123" maxlength="20" required></label><label>Marca<input name="marca" placeholder="Ej. Yamaha" maxlength="50" required></label><label class="full">Modelo<input name="modelo" placeholder="Ej. FZ 2.0" maxlength="50" required></label><label class="full">Tipo de moto<select name="tipo_tecnologia" required><option value="electronica">Electrónica (usa escáner)</option><option value="no_electronica">No electrónica (revisión mecánica)</option></select></label><label class="mechanic-field">Nombre del cliente<input name="cliente_nombre" placeholder="Nombre del propietario" maxlength="100" required></label><label class="mechanic-field">Correo del cliente<input name="cliente_email" type="email" placeholder="cliente@correo.com" required></label></div><div class="actions"><button class="btn primary">Registrar moto</button></div></form></dialog>
<dialog id="cita-modal"><form id="cita-form"><div class="modal-title"><div><p class="eyebrow" id="cita-modal-label">Nueva cita</p><h2 id="cita-modal-title">Agendar servicio</h2></div><button class="close-cita" type="button">×</button></div><input id="cita-id" type="hidden"><div class="form-grid"><label class="full">Moto<select id="cita-moto" name="moto_id" required><option value="">Elige una moto</option></select></label><label>Fecha<input id="cita-fecha" name="fecha" type="date" required></label><label>Servicio<input id="cita-descripcion" name="descripcion" placeholder="Ej. Diagnóstico general" required></label></div><div class="actions"><button class="btn ghost close-cita" type="button">Cancelar</button><button id="save-cita" class="btn primary">Agendar cita</button></div></form></dialog>
<dialog id="inventario-modal"><form id="inventario-form"><div class="modal-title"><div><p class="eyebrow">Nuevo ítem</p><h2>Agregar al inventario</h2></div><button class="close-inventario" type="button">×</button></div><input id="inventario-id" type="hidden"><div class="form-grid"><label class="full">Nombre del ítem<input name="nombre" placeholder="Ej. Pastillas de freno" maxlength="80" required></label><label>Categoría<select name="categoria" required><option value="">Selecciona</option><option value="repuesto">Repuesto</option><option value="herramienta">Herramienta</option><option value="insumo">Insumo</option><option value="lubricante">Lubricante</option><option value="accesorio">Accesorio</option></select></label><label>Unidad<select name="unidad"><option value="unidades">Unidades</option><option value="litros">Litros</option><option value="cajas">Cajas</option><option value="pares">Pares</option><option value="metros">Metros</option></select></label><label>Cantidad disponible<input name="cantidad" type="number" min="0" step="1" placeholder="0" required></label><label>Stock mínimo<input name="stock_minimo" type="number" min="0" step="1" placeholder="0" required></label><label class="full">Proveedor (opcional)<input name="proveedor" placeholder="Nombre del proveedor" maxlength="100"></label></div><div class="actions"><button class="btn ghost close-inventario" type="button">Cancelar</button><button id="save-item" class="btn primary">Guardar ítem</button></div></form></dialog>
<dialog id="factura-modal"><form id="factura-form"><input id="factura-id" type="hidden"><div class="modal-title"><div><p class="eyebrow">Nueva factura</p><h2>Crear factura</h2></div><button class="close-factura" type="button">×</button></div><div class="form-grid"><label class="full">Moto del cliente<select id="factura-moto" name="moto_id" required><option value="">Elige una moto</option></select></label><label>Fecha<input name="fecha" type="date" required></label><label>Estado<select name="estado" required><option value="pendiente">Pendiente</option><option value="pagada">Pagada</option></select></label><label class="full">Detalle del servicio<textarea name="descripcion" placeholder="Describe el servicio realizado" maxlength="500" required></textarea></label><label>Subtotal<input name="subtotal" type="number" min="0" step="0.01" placeholder="0.00" required></label><label>IVA (%)<input name="iva" type="number" min="0" max="100" step="0.01" value="19" required></label></div><div class="actions"><button class="btn ghost close-factura" type="button">Cancelar</button><button id="save-factura" class="btn primary">Crear factura</button></div></form></dialog>
<dialog id="orden-modal"><form id="orden-form"><div class="modal-title"><div><p class="eyebrow">Nueva orden</p><h2>Orden de servicio</h2></div><button class="close-orden" type="button">×</button></div><div class="form-grid"><label class="full">Moto<select id="orden-moto" name="moto_id" required><option value="">Elige una moto</option></select></label><label class="full">Trabajo a realizar<textarea name="descripcion" maxlength="800" placeholder="Ej. Cambio de aceite, ajuste de frenos y revisión general" required></textarea></label></div><div class="order-parts"><div class="panel-title"><div><h3>Repuestos usados</h3><p>Se descuentan del inventario al guardar.</p></div><button id="add-orden-repuesto" class="text-btn" type="button">+ Agregar repuesto</button></div><div id="orden-repuestos"></div></div><div class="actions"><button class="btn ghost close-orden" type="button">Cancelar</button><button class="btn primary">Crear orden</button></div></form></dialog>
